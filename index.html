<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#315bdb" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("zhmi:theme");
        } catch {}
        const dark =
          theme === "dark" ||
          (!theme && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark)
          document.querySelector('meta[name="theme-color"]').content =
            "#142331";
      })();
    </script>
    <meta
      name="description"
      content="ЖМИ, БРАТ — умный тренировочный дневник. RPE, циклы, техника и совместные комнаты."
    />
    <title>ЖМИ, БРАТ · твоя качалка</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./calendar.css" />
    <link rel="stylesheet" href="./buddy.css" />
    <link rel="stylesheet" href="./refinements.css" />
    <link rel="stylesheet" href="./theme.css" />
    <script defer src="./peerjs.min.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <span>💪</span>
        <h1>ЖМИ, БРАТ</h1>
        <p data-loading-line role="status">Раскладываем блины по местам…</p>
      </div>
    </div>
    <script>
      (() => {
        const target = document.querySelector("[data-loading-line]");
        const lines = [
          "Раскладываем блины по местам…",
          "Ну что, по подходику?",
          "Качок разминается. Дневник подтягивается.",
          "Собираем стаю. Волк уже на месте 🐺",
          "Гориллы проверяют базу 🦍",
          "Пока грузимся — расправь плечи, брат.",
          "Протираем скамью для великих дел…",
          "Подкручиваем бицепс. Почти готово.",
          "Загружаем железо. Спину держим ровно.",
          "Банан напарнику. Подход — тебе 🍌",
          "Секунду, брат. Блины сами себя не разложат.",
          "Дневник просыпается. Качок уже дышит.",
        ];
        let previous = -1;
        try {
          previous = Number(sessionStorage.getItem("zhmi:loading-line") ?? -1);
        } catch {}
        let current =
          (previous + 1 + Math.floor(Math.random() * (lines.length - 1))) %
          lines.length;
        target.textContent = lines[current];
        try {
          sessionStorage.setItem("zhmi:loading-line", String(current));
        } catch {}
        const timer = setInterval(() => {
          if (!target.isConnected) {
            clearInterval(timer);
            return;
          }
          current =
            (current + 1 + Math.floor(Math.random() * (lines.length - 1))) %
            lines.length;
          target.textContent = lines[current];
        }, 2200);
      })();
    </script>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="reactions" aria-hidden="true"></div>
    <noscript>Для дневника нужен JavaScript.</noscript>
  </body>
</html>
